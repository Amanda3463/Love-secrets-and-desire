<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love, Secrets & Desire</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background: linear-gradient(135deg, #24151d, #4a2635, #1c1117);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.logo {
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #d8b5a6;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 38px;
  font-weight: normal;
  letter-spacing: 1px;
}

.subtitle {
  color: #d8c8cc;
  font-family: Arial, sans-serif;
  font-size: 15px;
  margin: 12px 0 28px;
}

.card {
  background: linear-gradient(145deg, #fffaf7, #f4e9e5);
  color: #35242a;
  border-radius: 24px;
  min-height: 330px;
  padding: 45px 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.3);
}

.card-label {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #9b6879;
  margin-bottom: 25px;
}

#question {
  font-size: 25px;
  line-height: 1.5;
  max-width: 430px;
}

button {
  margin-top: 35px;
  padding: 15px 34px;
  border: none;
  border-radius: 30px;
  background: #6f3049;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

button:hover {
  background: #8a405d;
}

.footer {
  margin-top: 25px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #bfaeb3;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">100 Questions</div>

  <h1>Love, Secrets & Desire</h1>

  <p class="subtitle">
    Questions for couples, lovers and the curious.
  </p>

  <div class="card">

    <div class="card-label">Question</div>

    <div id="question">
      Loading your question...
    </div>

    <button onclick="nextQuestion()">
      Next Question
    </button>

  </div>

  <div class="footer">
    How honest are you willing to be?
  </div>

</div>

<script>

const SUPABASE_URL =
"https://omxbwixylvtxerazrhgn.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_I8UQSRhzqY_1a5DJXW1-mw_RLbxOxqj";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let questions = [];
let currentIndex = 0;

async function loadQuestions() {

  const { data, error } = await supabaseClient
    .from("cards")
    .select("question");

  if (error) {

    document.getElementById("question").textContent =
      "We couldn't load the questions yet.";

    return;
  }

  questions = data || [];

  if (questions.length > 0) {

    document.getElementById("question").textContent =
      questions[0].question;

  } else {

    document.getElementById("question").textContent =
      "No questions available yet.";

  }
}

function nextQuestion() {

  if (questions.length === 0) return;

  currentIndex =
    (currentIndex + 1) % questions.length;

  document.getElementById("question").textContent =
    questions[currentIndex].question;
}

loadQuestions();

</script>

</body>
</html>
