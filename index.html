<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love, Secrets & Desire</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  background: #24151b;
  color: #f8eee7;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 650px;
  padding: 30px 20px;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.subtitle {
  color: #d8b9ad;
  margin-bottom: 30px;
  font-family: Arial, sans-serif;
}

.sections {
  display: grid;
  gap: 12px;
  margin-bottom: 25px;
}

.section-button {
  background: #f4e6dc;
  color: #351b23;
  border: none;
  padding: 17px 15px;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
  font-family: Georgia, serif;
  transition: 0.2s;
}

.section-button:hover {
  transform: translateY(-2px);
  background: #ffffff;
}

.game {
  display: none;
}

.back {
  background: transparent;
  border: 1px solid #c9a79b;
  color: #f8eee7;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  margin-bottom: 20px;
}

.category-title {
  color: #d8b9ad;
  font-size: 15px;
  margin-bottom: 12px;
  font-family: Arial, sans-serif;
}

.card {
  background: #f8eee7;
  color: #321b22;
  border-radius: 22px;
  padding: 50px 30px;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

.label {
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 12px;
  color: #9b6b5d;
  margin-bottom: 25px;
  font-family: Arial, sans-serif;
}

.question {
  font-size: 27px;
  line-height: 1.4;
}

.next {
  margin-top: 25px;
  background: #b88978;
  color: white;
  border: none;
  padding: 15px 28px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}

.next:hover {
  background: #9f6f60;
}

.error {
  color: #e7aaa0;
  font-family: Arial, sans-serif;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div id="home">
    <h1>Love, Secrets & Desire</h1>
    <div class="subtitle">
      Questions for couples, lovers and the curious.
    </div>

    <div class="sections">
      <button class="section-button" onclick="startGame('Attraction & Connection')">
        Attraction & Connection
      </button>

      <button class="section-button" onclick="startGame('Love, Trust & Secrets')">
        Love, Trust & Secrets
      </button>

      <button class="section-button" onclick="startGame('Desire & Intimacy')">
        Desire & Intimacy
      </button>

      <button class="section-button" onclick="startGame('Past Loves & Temptation')">
        Past Loves & Temptation
      </button>

      <button class="section-button" onclick="startGame('Love, Choices & Confessions')">
        Love, Choices & Confessions
      </button>
    </div>

    <div id="homeError" class="error"></div>
  </div>

  <div id="game" class="game">

    <button class="back" onclick="goHome()">← Back to sections</button>

    <div id="categoryTitle" class="category-title"></div>

    <div class="card">
      <div class="label">Question</div>
      <div id="question" class="question">
        Loading...
      </div>
    </div>

    <button class="next" onclick="nextQuestion()">
      Next Question
    </button>

  </div>

</div>

<script>

const SUPABASE_URL = "https://omxbwixylvtxerazrhgn.supabase.co";
const SUPABASE_KEY = "sb_publishable_I8UQSRhzqY_1a5DJXW1-mw_RLbxOxqj";

let allQuestions = [];
let currentQuestions = [];
let currentIndex = 0;
let currentSection = "";

async function loadQuestions() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/cards?select=question,section&order=created_at.asc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Could not load questions");
    }

    allQuestions = await response.json();

  } catch (error) {

    document.getElementById("homeError").textContent =
      "We couldn't load the questions yet.";

  }
}

function startGame(section) {

  currentSection = section;

  currentQuestions = allQuestions.filter(
    item => item.section === section
  );

  currentIndex = 0;

  document.getElementById("home").style.display = "none";
  document.getElementById("game").style.display = "block";

  document.getElementById("categoryTitle").textContent = section;

  showQuestion();
}

function showQuestion() {

  if (currentQuestions.length === 0) {

    document.getElementById("question").textContent =
      "No questions found in this section.";

    return;
  }

  document.getElementById("question").textContent =
    currentQuestions[currentIndex].question;
}

function nextQuestion() {

  if (currentQuestions.length === 0) return;

  currentIndex++;

  if (currentIndex >= currentQuestions.length) {
    currentIndex = 0;
  }

  showQuestion();
}

function goHome() {

  document.getElementById("game").style.display = "none";
  document.getElementById("home").style.display = "block";
}

loadQuestions();

</script>

</body>
</html>
